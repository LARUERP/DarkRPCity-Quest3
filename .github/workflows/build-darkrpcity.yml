name: Build DarkRPCity Quest 3

on:
  workflow_dispatch:
  push:
    paths:
      - "Assets/Editor/**"
      - ".github/workflows/build-darkrpcity.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Unity cache
        uses: actions/cache@v4
        with:
          path: Library
          key: ${{ runner.os }}-darkrpcity-${{ hashFiles('Assets/Editor/**', 'Packages/**') }}
          restore-keys: |
            ${{ runner.os }}-darkrpcity-

      - name: Download and prepare original DarkRPCity
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 "https://github.com/LARUERP/DarkRPCity-Quest3/releases/download/v0.1-ressources/DarkRPCity_RECONSTRUCTION.zip" -o source.zip
          python3 - <<'PYTHON'
          import zipfile, json, os, shutil
          from pathlib import PurePosixPath

          with zipfile.ZipFile("source.zip") as z:
              names = z.namelist()
              def find(name):
                  matches = [n for n in names if PurePosixPath(n).name == name]
                  if not matches:
                      raise RuntimeError("Absent de l'archive : " + name)
                  return matches[0]

              manifest = json.loads(z.read(find("DarkRPCity_UNITY_MANIFEST.json")))
              if not manifest.get("objets") or not manifest.get("fichiers_mesh"):
                  raise RuntimeError("Manifeste incomplet")

              os.makedirs("DarkRPCity_Staging", exist_ok=True)
              runtime = dict(manifest)
              runtime["objets"] = []
              for obj in manifest["objets"]:
                  item = dict(obj)
                  matrix = obj.get("matrice_monde")
                  if matrix and len(matrix) == 4:
                      item["matrix"] = [float(v) for row in matrix for v in row]
                  runtime["objets"].append(item)

              with open("DarkRPCity_Staging/DarkRPCity_RUNTIME_MANIFEST.json", "w", encoding="utf-8") as f:
                  json.dump(runtime, f, ensure_ascii=False)

              mesh_ids = {o.get("mesh_id") for o in manifest["objets"]}
              wanted = {m["fichier"] for m in manifest["fichiers_mesh"] if m.get("mesh_id") in mesh_ids}
              copied = 0

              for name in names:
                  if name.endswith("/"):
                      continue
                  base = PurePosixPath(name).name
                  ext = PurePosixPath(base).suffix.lower()
                  if base not in wanted and ext not in (".mtl", ".png", ".jpg", ".jpeg", ".tga"):
                      continue
                  target = os.path.join("DarkRPCity_Staging", *PurePosixPath(name).parts)
                  os.makedirs(os.path.dirname(target), exist_ok=True)
                  if not os.path.exists(target):
                      with z.open(name) as src, open(target, "wb") as dst:
                          shutil.copyfileobj(src, dst, 1024 * 1024)
                      copied += 1

              print("Objets :", len(manifest["objets"]))
              print("Matériaux :", len(manifest.get("materiaux", [])))
              print("OBJ nécessaires :", len(wanted))
              print("Ressources copiées :", copied)
          PYTHON

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2021.3.16f1
          targetPlatform: Android
          buildMethod: DarkRPCitySceneBuilder.BuildFromCI
          allowDirtyBuild: true

      - name: Upload build and reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DarkRPCity-Quest3-Build
          path: |
            Assets/DarkRPCity_Generated/
            Assets/DarkRPCity_Build/
            Assets/DarkRPCity_Source/
            DarkRPCity_Staging/
          retention-days: 14
